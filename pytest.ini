[pytest]
filterwarnings =
    # PyMuPDF 1.x macOS SWIG bindings; remove when a compatible upgrade is available.
    ignore:^builtin type (SwigPyPacked|SwigPyObject|swigvarlink) has no __module__ attribute$:DeprecationWarning
    # PyMuPDF 1.x typing compatibility alias, scoped to that dependency only.
    ignore:^'typing\.ByteString' and 'collections\.abc\.ByteString' are deprecated and slated for removal in Python 3\.17$:DeprecationWarning:^pymupdf$
